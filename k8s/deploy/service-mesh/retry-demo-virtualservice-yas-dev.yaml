apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: flaky-retry
  namespace: yas-dev
spec:
  hosts:
    - flaky
    - flaky.yas-dev.svc.cluster.local
  http:
    - retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream,gateway-error,reset
      route:
        - destination:
            host: flaky.yas-dev.svc.cluster.local
            port:
              number: 80
