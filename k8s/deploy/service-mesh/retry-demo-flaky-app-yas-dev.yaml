apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky-good
  namespace: yas-dev
  labels:
    app: flaky
    version: good
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flaky
      version: good
  template:
    metadata:
      labels:
        app: flaky
        version: good
      annotations:
        sidecar.istio.io/proxyCPU: 1m
        sidecar.istio.io/proxyMemory: 32Mi
        sidecar.istio.io/proxyCPULimit: 250m
        sidecar.istio.io/proxyMemoryLimit: 256Mi
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"flaky-good: 200\n")
                  def log_message(self, format, *args):
                      pass
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky-bad
  namespace: yas-dev
  labels:
    app: flaky
    version: bad
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flaky
      version: bad
  template:
    metadata:
      labels:
        app: flaky
        version: bad
      annotations:
        sidecar.istio.io/proxyCPU: 1m
        sidecar.istio.io/proxyMemory: 32Mi
        sidecar.istio.io/proxyCPULimit: 250m
        sidecar.istio.io/proxyMemoryLimit: 256Mi
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(500)
                      self.end_headers()
                      self.wfile.write(b"flaky-bad: 500\n")
                  def log_message(self, format, *args):
                      pass
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: flaky
  namespace: yas-dev
  labels:
    app: flaky
spec:
  selector:
    app: flaky
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: flaky-mtls
  namespace: yas-dev
spec:
  host: flaky.yas-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
